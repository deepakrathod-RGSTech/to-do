name: Build Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend
        run: |
          docker build -t rathod3232/to-do-backend:latest ./backend

      - name: Push Backend
        run: |
          docker push rathod3232/to-do-backend:latest

      - name: Build Frontend
        run: |
          docker build -t rathod3232/to-do-frontend:latest ./frontend

      - name: Push Frontend
        run: |
          docker push rathod3232/to-do-frontend:latest